spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:uploadtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  kafka:
    producer:
      bootstrap-servers: localhost:9092

aws:
  s3:
    bucket: test-bucket
  region: ap-south-1
